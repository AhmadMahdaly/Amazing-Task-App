name: s
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.9.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  go_router: ^17.0.1
  url_launcher: ^6.3.2
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0 
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.2.3
  equatable: ^2.0.7
  flutter_iconly: ^1.0.2
  flutter_local_notifications: ^20.1.0
  permission_handler: ^12.0.1
  image_picker: ^1.2.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.0.0
  pretty_dio_logger: ^1.4.0
  icons_launcher: ^3.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/png/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
icons_launcher:
  image_path: "assets/images/png/logo.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true


# dart run icons_launcher:create
# flutter gen-l10n
